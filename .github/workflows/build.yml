name: Build Instant Pump

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build VST3 + AU
        run: cmake --build build --config Release --target InstantPump_VST3 InstantPump_AU -j 4
      - name: Ad-hoc sign and zip
        run: |
          A="build/InstantPump_artefacts/Release"
          codesign --force --deep -s - "$A/VST3/Instant Pump.vst3"
          codesign --force --deep -s - "$A/AU/Instant Pump.component"
          mkdir -p dist
          ditto -c -k --keepParent "$A/VST3/Instant Pump.vst3" "dist/Instant Pump VST3 (Mac).zip"
          ditto -c -k --keepParent "$A/AU/Instant Pump.component" "dist/Instant Pump AU (Mac).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: InstantPump-mac
          path: dist/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build VST3
        run: cmake --build build --config Release --target InstantPump_VST3
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/InstantPump_artefacts/Release/VST3/Instant Pump.vst3" -DestinationPath "dist/Instant Pump VST3 (Windows).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: InstantPump-windows
          path: dist/
