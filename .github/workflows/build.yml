name: Build Instant Pump

# Public repository: GitHub Actions is free, so Mac + Windows build on every push.
# Pushing a tag vX.Y.Z also publishes a Release with direct download links.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libfreetype-dev libfontconfig1-dev xvfb
      - name: Build tests
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKD_BUILD_TOOLS=ON && cmake --build build -j 4 --target kd_envelope_test kd_snapshot
      - name: Run tests
        run: |
          ./build/kd_envelope_test
          xvfb-run -a ./build/kd_snapshot_artefacts/Release/kd_snapshot preview.png

  macos:
    needs: test-linux
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build VST3 + AU
        run: cmake --build build --config Release --target InstantPump_VST3 InstantPump_AU -j 4
      - name: Sign (ad-hoc) and package
        run: |
          A="build/InstantPump_artefacts/Release"
          codesign --force --deep -s - "$A/VST3/Rave Academy Instant Pump.vst3"
          codesign --force --deep -s - "$A/AU/Rave Academy Instant Pump.component"
          # fail the build if the binary would not load on older macOS
          B="$A/VST3/Rave Academy Instant Pump.vst3/Contents/MacOS/Rave Academy Instant Pump"
          vtool -arch x86_64 -show-build "$B" | tee /dev/stderr | grep -q "minos 10.13"
          vtool -arch arm64 -show-build "$B" | tee /dev/stderr | grep -q "minos 11.0"
          mkdir -p "pkg/Instant Pump (Mac)" dist
          cp -R "$A/VST3/Rave Academy Instant Pump.vst3" "$A/AU/Rave Academy Instant Pump.component" "pkg/Instant Pump (Mac)/"
          cp Install/INSTALUJ-Mac.txt LICENSE "pkg/Instant Pump (Mac)/"
          git archive --format=zip -o "pkg/Instant Pump (Mac)/Instant Pump - kod zrodlowy.zip" HEAD
          ditto -c -k --keepParent "pkg/Instant Pump (Mac)" dist/InstantPump-Mac.zip
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/ }

  windows:
    needs: test-linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build VST3
        run: cmake --build build --config Release --target InstantPump_VST3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "pkg/Instant Pump (Windows)", dist | Out-Null
          Copy-Item -Recurse "build/InstantPump_artefacts/Release/VST3/Rave Academy Instant Pump.vst3" "pkg/Instant Pump (Windows)/"
          Copy-Item Install/INSTALUJ-Windows.txt, LICENSE "pkg/Instant Pump (Windows)/"
          git archive --format=zip -o "pkg/Instant Pump (Windows)/Instant Pump - kod zrodlowy.zip" HEAD
          Compress-Archive -Path "pkg/Instant Pump (Windows)" -DestinationPath dist/InstantPump-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/ }

  release:
    # every successful build of main becomes a release v1.0.<run number>; "latest" links follow it
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Instant Pump ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/InstantPump-Mac.zip
            dist/InstantPump-Windows.zip
          make_latest: true
